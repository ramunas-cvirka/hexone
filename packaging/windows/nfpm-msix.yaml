# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
name: hexone
arch: amd64
platform: windows
version: ${HEXONE_SEMVER}
version_schema: semver
maintainer: Ramunas Cvirka
description: Keyboard-driven file manager with a built-in viewer
vendor: Ramunas Cvirka
homepage: https://github.com/ramunas-cvirka/hexone
license: Apache-2.0

contents:
  - src: ./dist/hexone-windows-amd64-portable/hexone.exe
    dst: app/hexone.exe
  - src: ./dist/hexone-windows-amd64-portable/protocols.yaml
    dst: app/protocols.yaml
  - src: ./LICENSE
    dst: LICENSE
  - src: ./NOTICE
    dst: NOTICE
  - src: ./dist/msix-assets/logo.png
    dst: Assets/logo.png
  - src: ./dist/msix-assets/Square150x150Logo.png
    dst: Assets/Square150x150Logo.png
  - src: ./dist/msix-assets/Square44x44Logo.png
    dst: Assets/Square44x44Logo.png

msix:
  arch: x64
  publisher: ${HEXONE_MSIX_PUBLISHER}
  identity:
    resource_id: ""
  properties:
    display_name: Hexone
    publisher_display_name: Ramunas Cvirka
    logo: Assets/logo.png
  applications:
    - id: Hexone
      executable: app/hexone.exe
      entry_point: Windows.FullTrustApplication
      visual_elements:
        display_name: Hexone
        description: Keyboard-driven file manager with a built-in viewer
        background_color: transparent
        square150x150_logo: Assets/Square150x150Logo.png
        square44x44_logo: Assets/Square44x44Logo.png
  dependencies:
    target_device_families:
      - name: Windows.Desktop
        min_version: "10.0.17763.0"
        max_version_tested: "10.0.22621.0"
  capabilities:
    capabilities:
      - internetClient
    restricted:
      - runFullTrust

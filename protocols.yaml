# ------------------------------------------------------------
# Spec language summary (what this YAML uses)
#
# Node types:
#   - field: read a typed value, produce a span (and store value in ctx by name)
#   - assert: evaluate boolean expr, on false add error (and optionally stop)
#   - switch: evaluate expr, pick a case layout, else default
#   - choose: evaluate branch `when` conditions in order, run first matching body
#   - route: peek hints, match branch condition, run named target body
#   - repeat: repeat body count times
#   - set: assign evaluated expression value into ctx by name
#   - peek: read typed value at absolute offset without consuming bytes
#   - hook: call custom Go hook; it may emit spans and/or set ctx values
#   - align: advance cursor to next boundary (pads/skips bytes)
#
# Expressions:
#   integers: 123, 0x1A
#   identifiers: previously parsed numeric fields, plus builtins:
#       remaining, offset, size
#   ops: + - * / % (int), parentheses
#   comparisons: == != < <= > >=
#   logical: && || !   (used in assert/choose/route/peek.when)
#
# Builtins:
#   - size:
#       Total byte count of the CURRENT decode scope.
#       Top-level layout -> full input frame length.
#       Inside enter_field_reader(body) -> only that field slice length.
#   - offset:
#       Current absolute cursor position in the full input frame.
#   - remaining:
#       Bytes left to read in the CURRENT scope, starting at current cursor.
#
# Quick example:
#   - Top-level frame has 40 bytes: size == 40.
#   - A field "payload" is 20 bytes, then enter_field_reader(payload):
#       inside that body, size == 20 (not 40),
#       remaining starts at 20 and decreases as fields are read.
# ------------------------------------------------------------

version: 1

protocols:
  - name: gt06
    desc: "GT06 / Jimi-style framing"
    endian: be
    colors:
      header: header
      len: len
      id: id
      payload: payload
      serial: serial
      meta: meta
      crc: crc
      tail: tail
      error: error

    layout:
      - field:
          {
            name: header,
            type: u16,
            color: header,
            desc: "Start bits (0x7878 or 0x7979)",
          }

      - switch:
          expr: "header"
          cases:
            0x7878:
              - field:
                  {
                    name: length,
                    type: u8,
                    color: len,
                    desc: "Packet length (protocol + info + serial + crc)",
                  }
            0x7979:
              - field:
                  {
                    name: length,
                    type: u16,
                    color: len,
                    desc: "Packet length (protocol + info + serial + crc)",
                  }
          default:
            - assert:
                {
                  expr: "0 == 1",
                  message: "Unknown GT06 header; expected 0x7878 or 0x7979",
                }

      - choose:
          branches:
            # Header 0x7878: total frame bytes are length + 5 (standard) or length + 7 (variant).
            - when: "header == 0x7878 && length >= 5 && length + 5 == size"
              body:
                - set: { name: gt06.payload_len, expr: "length - 5" }
            - when: "header == 0x7878 && length >= 3 && length + 7 == size"
              body:
                - set: { name: gt06.payload_len, expr: "length - 3" }

            # Header 0x7979 has one extra length byte, so total is +6 / +8.
            - when: "header == 0x7979 && length >= 5 && length + 6 == size"
              body:
                - set: { name: gt06.payload_len, expr: "length - 5" }
            - when: "header == 0x7979 && length >= 3 && length + 8 == size"
              body:
                - set: { name: gt06.payload_len, expr: "length - 3" }

          default:
            - assert:
                expr: "0 == 1"
                message: "GT06 length mismatch for header/packet size"

      - field: { name: protocol_id, type: u8, color: id, desc: "Protocol ID" }

      # Standard GT06 uses length = protocol(1) + info(N) + serial(2) + crc(2).
      # Some variants omit CRC from advertised length; choose/set above handles both.
      - field:
          name: payload
          type: bytes
          len_expr: "gt06.payload_len"
          color: payload
          desc: "Info content"

      - hook:
          name: enter_field_reader
          args: { field: payload }
          body:
            - switch:
                expr: "protocol_id"
                cases:
                  0x01:
                    - field:
                        {
                          name: "login.imei_bcd",
                          type: bytes,
                          len: 8,
                          color: meta,
                          value_fmt: bcd,
                          desc: "IMEI bytes (BCD-ish)",
                        }
                  0x13:
                    - field: { name: "hb.terminal_info", type: u8, color: meta, value_fmt: hex, desc: "Terminal information content" }
                    - field: { name: "hb.voltage", type: u8, color: meta, value_fmt: dec, desc: "Battery / voltage level" }
                    - field: { name: "hb.gsm", type: u8, color: meta, value_fmt: dec, desc: "GSM signal strength" }
                    - field: { name: "hb.alarm_lang", type: u16, color: meta, value_fmt: hex, desc: "Alarm / language" }
                  0x12:
                    - field: { name: "loc.datetime", type: bytes, len: 6, color: meta, value_fmt: datetime_bcd6, desc: "Tracker timestamp (YYMMDDhhmmss)" }
                    - field: { name: "loc.gps_info", type: u8, color: meta, value_fmt: hex, desc: "GPS info / satellite count" }
                    - field: { name: "loc.lat", type: u32, color: meta, value_fmt: coord_gt06, desc: "Latitude degrees (GT06 raw / 1800000)" }
                    - field: { name: "loc.lon", type: u32, color: meta, value_fmt: coord_gt06, desc: "Longitude degrees (GT06 raw / 1800000)" }
                    - field: { name: "loc.speed", type: u8, color: meta, value_fmt: dec, desc: "Speed km/h" }
                    - field: { name: "loc.course_status", type: u16, color: meta, value_fmt: hex, desc: "Course / status flags" }
                    - field: { name: "loc.mcc", type: u16, color: meta, value_fmt: dec, desc: "Mobile country code" }
                    - field: { name: "loc.mnc", type: u8, color: meta, value_fmt: dec, desc: "Mobile network code" }
                    - field: { name: "loc.lac", type: u16, color: meta, value_fmt: hex, desc: "Location area code" }
                    - field: { name: "loc.cell_id", type: u24, color: meta, value_fmt: hex, desc: "Cell ID" }
                  0x16:
                    - field: { name: "alarm.datetime", type: bytes, len: 6, color: meta, value_fmt: datetime_bcd6, desc: "Alarm timestamp (YYMMDDhhmmss)" }
                    - field: { name: "alarm.gps_info", type: u8, color: meta, value_fmt: hex, desc: "GPS info / satellite count" }
                    - field: { name: "alarm.lat", type: u32, color: meta, value_fmt: coord_gt06, desc: "Latitude degrees (GT06 raw / 1800000)" }
                    - field: { name: "alarm.lon", type: u32, color: meta, value_fmt: coord_gt06, desc: "Longitude degrees (GT06 raw / 1800000)" }
                    - field: { name: "alarm.speed", type: u8, color: meta, value_fmt: dec, desc: "Speed km/h" }
                    - field: { name: "alarm.course_status", type: u16, color: meta, value_fmt: hex, desc: "Course / status flags" }
                    - field: { name: "alarm.lbs_len", type: u8, color: meta, value_fmt: dec, desc: "LBS length" }
                    - field: { name: "alarm.mcc", type: u16, color: meta, value_fmt: dec, desc: "Mobile country code" }
                    - field: { name: "alarm.mnc", type: u8, color: meta, value_fmt: dec, desc: "Mobile network code" }
                    - field: { name: "alarm.lac", type: u16, color: meta, value_fmt: hex, desc: "Location area code" }
                    - field: { name: "alarm.cell_id", type: u24, color: meta, value_fmt: hex, desc: "Cell ID" }
                    - field: { name: "alarm.terminal_info", type: u8, color: meta, value_fmt: hex, desc: "Terminal information content" }
                    - field: { name: "alarm.voltage", type: u8, color: meta, value_fmt: dec, desc: "Battery / voltage level" }
                    - field: { name: "alarm.gsm", type: u8, color: meta, value_fmt: dec, desc: "GSM signal strength" }
                    - field: { name: "alarm.alarm_lang", type: u16, color: meta, value_fmt: hex, desc: "Alarm / language" }
                default:
                  - field:
                      {
                        name: "payload.rest",
                        type: bytes,
                        len_expr: "remaining",
                        color: meta,
                        desc: "Unparsed payload remainder",
                      }

      - field:
          {
            name: serial,
            type: u16,
            color: serial,
            value_fmt: dec,
            desc: "Information serial number",
          }

      - field:
          {
            name: crc,
            type: u16,
            color: crc,
            value_fmt: hex,
            desc: "CRC-ITU (aka X25/IBM-SDLC style in docs)",
          }

      - field:
          {
            name: stop,
            type: u16,
            const: 0x0D0A,
            color: tail,
            value_fmt: hex,
            desc: "Stop bits",
          }

      # Disabled for now: common public Jimi / GT06 examples frequently carry
      # CRC bytes that do not match the usual GT06 X25-style calculation.
      # Keep decoding the frame structure instead of rejecting an otherwise
      # well-formed packet.

  - name: teltonika
    desc: "Teltonika auto decoder (TCP IMEI/AVL/command + UDP AVL + ACKs)"
    endian: be
    colors:
      header: header
      len: len
      codec: id
      payload: payload
      io: meta
      id: id
      meta: meta
      crc: crc
      error: error

    layout:
      # Single-step route: inspect frame hints once, then decode selected target.
      - route:
          peek:
            - name: tel.length_u16
              type: u16
              at: 0
              when: "size >= 2"
              default: 0
            - name: tel.preamble_u32
              type: u32
              at: 0
              when: "size >= 4"
              default: 0
            - name: tel.ascii_after_len
              type: bytes
              at: 2
              len_expr: "size - 2"
              check: ascii_digits
              when: "size >= 3"
              default: false

          branches:
            - when: "size == 1"
              to: tcp_imei_ack
            - when: "size >= 2 && tel.length_u16 == size - 2 && size >= 3 && tel.ascii_after_len"
              to: tcp_imei_handshake
            - when: "size >= 2 && tel.length_u16 == 5 && size == 7"
              to: udp_ack
            - when: "size >= 2 && tel.length_u16 == size - 2 && tel.length_u16 >= 3"
              to: udp_avl_packet
            - when: "size >= 8 && tel.preamble_u32 == 0"
              to: tcp_framed_payload
            - when: "size == 4"
              to: tcp_avl_ack

          targets:
            # TCP IMEI handshake packet: [imei_length:u16][imei_ascii]
            tcp_imei_handshake:
              - field:
                  name: imei.length
                  type: u16
                  color: len
                  value_fmt: dec
                  desc: "IMEI length"
              - assert:
                  expr: "imei.length <= remaining"
                  message: "IMEI length exceeds remaining bytes"
              - field:
                  name: imei.value
                  type: bytes
                  len_expr: "imei.length"
                  color: payload
                  value_fmt: ascii
                  desc: "Device IMEI"

            # TCP IMEI handshake response: [accepted:u8]
            tcp_imei_ack:
              - field:
                  name: imei.accepted
                  type: u8
                  color: id
                  value_fmt: dec
                  desc: "IMEI accept flag (0 rejected, 1 accepted)"

            # TCP framed payload: preamble + data_length + data_field + crc32(low16 used)
            tcp_framed_payload:
              - field:
                  name: tcp.preamble
                  type: u32
                  const: 0x00000000
                  color: header
                  value_fmt: hex
                  desc: "TCP preamble"

              - field:
                  name: tcp.data_length
                  type: u32
                  color: len
                  value_fmt: dec
                  desc: "Data Field Length"

              - assert:
                  expr: "tcp.data_length + 4 <= remaining"
                  message: "Data Field Length exceeds remaining bytes"

              - field:
                  name: tcp.data_field
                  type: bytes
                  len_expr: "tcp.data_length"
                  color: payload
                  desc: "Bytes from codec_id to quantity/record count 2"

              - field:
                  name: tcp.crc32
                  type: u32
                  color: crc
                  value_fmt: hex
                  desc: "CRC-16/IBM is stored in low 16 bits"

              - hook:
                  name: verify_teltonika_crc16_ibm
                  args: { data_field: tcp.data_field, crc_field: tcp.crc32 }

              - hook:
                  name: enter_field_reader
                  args: { field: tcp.data_field }
                  body:
                    - field:
                        name: codec.id
                        type: u8
                        color: codec
                        value_fmt: hex
                        desc: "Codec ID (0x08, 0x8E, 0x10, 0x0C, 0x0D, 0x0E)"

                    - field:
                        name: record_count.start
                        type: u8
                        color: meta
                        value_fmt: dec
                        desc: "Record/Quantity count 1"

                    - switch:
                        expr: "codec.id"
                        cases:
                          0x08:
                            - repeat:
                                count_expr: "record_count.start"
                                body:
                                  - field: { name: "avl.timestamp", type: u64, color: meta, value_fmt: unix_ms, desc: "Timestamp (UTC)" }
                                  - field: { name: "avl.priority", type: u8, color: meta, value_fmt: dec, desc: "Priority" }
                                  - field: { name: "gps.longitude", type: i32, color: meta, value_fmt: coord_1e7, desc: "Longitude (degrees)" }
                                  - field: { name: "gps.latitude", type: i32, color: meta, value_fmt: coord_1e7, desc: "Latitude (degrees)" }
                                  - field: { name: "gps.altitude_m", type: i16, color: meta, value_fmt: dec, desc: "Altitude (m)" }
                                  - field: { name: "gps.angle_deg", type: u16, color: meta, value_fmt: dec, desc: "Angle (degrees)" }
                                  - field: { name: "gps.satellites", type: u8, color: meta, value_fmt: dec, desc: "Satellite count" }
                                  - field: { name: "gps.speed_kmh", type: u16, color: meta, value_fmt: dec, desc: "Speed (km/h)" }

                                  - field: { name: "io.event_id", type: u8, color: io, value_fmt: dec, desc: "Event IO ID" }
                                  - field: { name: "io.total_count", type: u8, color: io, value_fmt: dec, desc: "Total IO elements" }

                                  - field: { name: "io.count_1b", type: u8, color: io, value_fmt: dec, desc: "1-byte IO element count" }
                                  - repeat:
                                      count_expr: "io.count_1b"
                                      body:
                                        - field: { name: "io.element_1b.id", type: u8, color: io, value_fmt: dec, desc: "1-byte IO ID" }
                                        - field: { name: "io.element_1b.value", type: u8, color: io, value_fmt: dec, desc: "1-byte IO value" }

                                  - field: { name: "io.count_2b", type: u8, color: io, value_fmt: dec, desc: "2-byte IO element count" }
                                  - repeat:
                                      count_expr: "io.count_2b"
                                      body:
                                        - field: { name: "io.element_2b.id", type: u8, color: io, value_fmt: dec, desc: "2-byte IO ID" }
                                        - field: { name: "io.element_2b.value", type: u16, color: io, value_fmt: dec, desc: "2-byte IO value" }

                                  - field: { name: "io.count_4b", type: u8, color: io, value_fmt: dec, desc: "4-byte IO element count" }
                                  - repeat:
                                      count_expr: "io.count_4b"
                                      body:
                                        - field: { name: "io.element_4b.id", type: u8, color: io, value_fmt: dec, desc: "4-byte IO ID" }
                                        - field: { name: "io.element_4b.value", type: u32, color: io, value_fmt: dec, desc: "4-byte IO value" }

                                  - field: { name: "io.count_8b", type: u8, color: io, value_fmt: dec, desc: "8-byte IO element count" }
                                  - repeat:
                                      count_expr: "io.count_8b"
                                      body:
                                        - field: { name: "io.element_8b.id", type: u8, color: io, value_fmt: dec, desc: "8-byte IO ID" }
                                        - field: { name: "io.element_8b.value", type: u64, color: io, value_fmt: dec, desc: "8-byte IO value" }
                            - field: { name: record_count.end, type: u8, color: meta, value_fmt: dec, desc: "Record count 2" }
                            - assert: { expr: "record_count.end == record_count.start", message: "Record count mismatch" }

                          0x8E:
                            - repeat:
                                count_expr: "record_count.start"
                                body:
                                  - field: { name: "avl.timestamp", type: u64, color: meta, value_fmt: unix_ms, desc: "Timestamp (UTC)" }
                                  - field: { name: "avl.priority", type: u8, color: meta, value_fmt: dec, desc: "Priority" }
                                  - field: { name: "gps.longitude", type: i32, color: meta, value_fmt: coord_1e7, desc: "Longitude (degrees)" }
                                  - field: { name: "gps.latitude", type: i32, color: meta, value_fmt: coord_1e7, desc: "Latitude (degrees)" }
                                  - field: { name: "gps.altitude_m", type: i16, color: meta, value_fmt: dec, desc: "Altitude (m)" }
                                  - field: { name: "gps.angle_deg", type: u16, color: meta, value_fmt: dec, desc: "Angle (degrees)" }
                                  - field: { name: "gps.satellites", type: u8, color: meta, value_fmt: dec, desc: "Satellite count" }
                                  - field: { name: "gps.speed_kmh", type: u16, color: meta, value_fmt: dec, desc: "Speed (km/h)" }

                                  - field: { name: "io.event_id", type: u16, color: io, value_fmt: dec, desc: "Event IO ID" }
                                  - field: { name: "io.total_count", type: u16, color: io, value_fmt: dec, desc: "Total IO elements" }

                                  - field: { name: "io.count_1b", type: u16, color: io, value_fmt: dec, desc: "1-byte IO element count" }
                                  - repeat:
                                      count_expr: "io.count_1b"
                                      body:
                                        - field: { name: "io.element_1b.id", type: u16, color: io, value_fmt: dec, desc: "1-byte IO ID" }
                                        - field: { name: "io.element_1b.value", type: u8, color: io, value_fmt: dec, desc: "1-byte IO value" }

                                  - field: { name: "io.count_2b", type: u16, color: io, value_fmt: dec, desc: "2-byte IO element count" }
                                  - repeat:
                                      count_expr: "io.count_2b"
                                      body:
                                        - field: { name: "io.element_2b.id", type: u16, color: io, value_fmt: dec, desc: "2-byte IO ID" }
                                        - field: { name: "io.element_2b.value", type: u16, color: io, value_fmt: dec, desc: "2-byte IO value" }

                                  - field: { name: "io.count_4b", type: u16, color: io, value_fmt: dec, desc: "4-byte IO element count" }
                                  - repeat:
                                      count_expr: "io.count_4b"
                                      body:
                                        - field: { name: "io.element_4b.id", type: u16, color: io, value_fmt: dec, desc: "4-byte IO ID" }
                                        - field: { name: "io.element_4b.value", type: u32, color: io, value_fmt: dec, desc: "4-byte IO value" }

                                  - field: { name: "io.count_8b", type: u16, color: io, value_fmt: dec, desc: "8-byte IO element count" }
                                  - repeat:
                                      count_expr: "io.count_8b"
                                      body:
                                        - field: { name: "io.element_8b.id", type: u16, color: io, value_fmt: dec, desc: "8-byte IO ID" }
                                        - field: { name: "io.element_8b.value", type: u64, color: io, value_fmt: dec, desc: "8-byte IO value" }

                                  - field: { name: "io.count_var", type: u16, color: io, value_fmt: dec, desc: "Variable-size IO element count" }
                                  - repeat:
                                      count_expr: "io.count_var"
                                      body:
                                        - field: { name: "io.element_var.id", type: u16, color: io, value_fmt: dec, desc: "Variable-size IO ID" }
                                        - field: { name: "io.element_var.length", type: u16, color: io, value_fmt: dec, desc: "Variable-size IO value length" }
                                        - field:
                                            name: "io.element_var.value"
                                            type: bytes
                                            len_expr: "io.element_var.length"
                                            color: io
                                            value_fmt: hex
                                            desc: "Variable-size IO value"
                            - field: { name: record_count.end, type: u8, color: meta, value_fmt: dec, desc: "Record count 2" }
                            - assert: { expr: "record_count.end == record_count.start", message: "Record count mismatch" }

                          0x10:
                            - repeat:
                                count_expr: "record_count.start"
                                body:
                                  - field: { name: "avl.timestamp", type: u64, color: meta, value_fmt: unix_ms, desc: "Timestamp (UTC)" }
                                  - field: { name: "avl.priority", type: u8, color: meta, value_fmt: dec, desc: "Priority" }
                                  - field: { name: "gps.longitude", type: i32, color: meta, value_fmt: coord_1e7, desc: "Longitude (degrees)" }
                                  - field: { name: "gps.latitude", type: i32, color: meta, value_fmt: coord_1e7, desc: "Latitude (degrees)" }
                                  - field: { name: "gps.altitude_m", type: i16, color: meta, value_fmt: dec, desc: "Altitude (m)" }
                                  - field: { name: "gps.angle_deg", type: u16, color: meta, value_fmt: dec, desc: "Angle (degrees)" }
                                  - field: { name: "gps.satellites", type: u8, color: meta, value_fmt: dec, desc: "Satellite count" }
                                  - field: { name: "gps.speed_kmh", type: u16, color: meta, value_fmt: dec, desc: "Speed (km/h)" }
                                  - field: { name: "avl.generation_type", type: u8, color: meta, value_fmt: dec, desc: "Generation type" }

                                  - field: { name: "io.event_id", type: u16, color: io, value_fmt: dec, desc: "Event IO ID" }
                                  - field: { name: "io.total_count", type: u16, color: io, value_fmt: dec, desc: "Total IO elements" }

                                  - field: { name: "io.count_1b", type: u8, color: io, value_fmt: dec, desc: "1-byte IO element count" }
                                  - repeat:
                                      count_expr: "io.count_1b"
                                      body:
                                        - field: { name: "io.element_1b.id", type: u16, color: io, value_fmt: dec, desc: "1-byte IO ID" }
                                        - field: { name: "io.element_1b.value", type: u8, color: io, value_fmt: dec, desc: "1-byte IO value" }

                                  - field: { name: "io.count_2b", type: u8, color: io, value_fmt: dec, desc: "2-byte IO element count" }
                                  - repeat:
                                      count_expr: "io.count_2b"
                                      body:
                                        - field: { name: "io.element_2b.id", type: u16, color: io, value_fmt: dec, desc: "2-byte IO ID" }
                                        - field: { name: "io.element_2b.value", type: u16, color: io, value_fmt: dec, desc: "2-byte IO value" }

                                  - field: { name: "io.count_4b", type: u8, color: io, value_fmt: dec, desc: "4-byte IO element count" }
                                  - repeat:
                                      count_expr: "io.count_4b"
                                      body:
                                        - field: { name: "io.element_4b.id", type: u16, color: io, value_fmt: dec, desc: "4-byte IO ID" }
                                        - field: { name: "io.element_4b.value", type: u32, color: io, value_fmt: dec, desc: "4-byte IO value" }

                                  - field: { name: "io.count_8b", type: u8, color: io, value_fmt: dec, desc: "8-byte IO element count" }
                                  - repeat:
                                      count_expr: "io.count_8b"
                                      body:
                                        - field: { name: "io.element_8b.id", type: u16, color: io, value_fmt: dec, desc: "8-byte IO ID" }
                                        - field: { name: "io.element_8b.value", type: u64, color: io, value_fmt: dec, desc: "8-byte IO value" }
                            - field: { name: record_count.end, type: u8, color: meta, value_fmt: dec, desc: "Record count 2" }
                            - assert: { expr: "record_count.end == record_count.start", message: "Record count mismatch" }

                          0x0C:
                            - field: { name: "command.type", type: u8, color: meta, value_fmt: hex, desc: "0x05 command / 0x06 response" }
                            - field: { name: "command.payload_size", type: u32, color: len, value_fmt: dec, desc: "Command payload size" }
                            - assert: { expr: "command.payload_size <= remaining - 1", message: "Codec12 message exceeds remaining bytes" }
                            - field: { name: "command.payload", type: bytes, len_expr: "command.payload_size", color: payload, value_fmt: ascii, desc: "Command or response text" }
                            - field: { name: "command.count_end", type: u8, color: meta, value_fmt: dec, desc: "Quantity 2" }
                            - assert: { expr: "command.count_end == record_count.start", message: "Codec12 quantity mismatch" }

                          0x0D:
                            - field: { name: "command.type", type: u8, const: 0x06, color: meta, value_fmt: hex, desc: "Response type" }
                            - field: { name: "command.payload_size", type: u32, color: len, value_fmt: dec, desc: "Payload size including timestamp" }
                            - assert: { expr: "command.payload_size >= 4 && command.payload_size <= remaining - 1", message: "Codec13 response size invalid" }
                            - field: { name: "command.timestamp", type: u32, color: meta, value_fmt: unix_s, desc: "Response timestamp (UTC)" }
                            - field: { name: "command.payload", type: bytes, len_expr: "command.payload_size - 4", color: payload, value_fmt: ascii, desc: "Response text" }
                            - field: { name: "command.count_end", type: u8, color: meta, value_fmt: dec, desc: "Quantity 2" }
                            - assert: { expr: "command.count_end == record_count.start", message: "Codec13 quantity mismatch" }

                          0x0E:
                            - field: { name: "command.type", type: u8, color: meta, value_fmt: hex, desc: "0x05 command / 0x06 response / 0x11 not executed" }
                            - field: { name: "command.payload_size", type: u32, color: len, value_fmt: dec, desc: "Payload size including IMEI" }
                            - assert: { expr: "command.payload_size >= 8 && command.payload_size <= remaining - 1", message: "Codec14 message size invalid" }
                            - field: { name: "command.target_imei", type: bytes, len: 8, color: payload, value_fmt: bcd, desc: "Target IMEI" }
                            - field: { name: "command.payload", type: bytes, len_expr: "command.payload_size - 8", color: payload, value_fmt: ascii, desc: "Command or response text" }
                            - field: { name: "command.count_end", type: u8, color: meta, value_fmt: dec, desc: "Quantity 2" }
                            - assert: { expr: "command.count_end == record_count.start", message: "Codec14 quantity mismatch" }

                        default:
                          - field:
                              name: "tcp.data_field.unknown_codec_rest"
                              type: bytes
                              len_expr: "remaining"
                              color: meta
                              value_fmt: hex
                              desc: "Unknown codec remainder"

            # TCP AVL data acknowledgement: [accepted_records:u32]
            tcp_avl_ack:
              - field:
                  name: avl.accepted_records
                  type: u32
                  color: id
                  value_fmt: dec
                  desc: "Accepted AVL record count"

            # UDP AVL channel packet.
            udp_avl_packet:
              - field:
                  name: udp.length
                  type: u16
                  color: len
                  value_fmt: dec
                  desc: "UDP packet length excluding this field"

              - assert:
                  expr: "udp.length >= 3 && udp.length <= remaining"
                  message: "UDP length invalid or exceeds remaining bytes"

              - field:
                  name: udp.packet_id
                  type: u16
                  color: header
                  value_fmt: dec
                  desc: "UDP packet ID"

              - field:
                  name: udp.channel_flag
                  type: u8
                  const: 0x01
                  color: meta
                  value_fmt: hex
                  desc: "Not usable byte (must be 0x01)"

              - field:
                  name: udp.payload
                  type: bytes
                  len_expr: "udp.length - 3"
                  color: payload
                  desc: "UDP payload after packet_id and channel flag"

              - hook:
                  name: enter_field_reader
                  args: { field: udp.payload }
                  body:
                    - field:
                        name: udp.avl_packet_id
                        type: u8
                        color: codec
                        value_fmt: dec
                        desc: "AVL packet ID"
                    - field:
                        name: imei.length
                        type: u16
                        color: len
                        value_fmt: dec
                        desc: "IMEI length"
                    - assert:
                        expr: "imei.length <= remaining"
                        message: "UDP IMEI length exceeds remaining bytes"
                    - field:
                        name: imei.value
                        type: bytes
                        len_expr: "imei.length"
                        color: payload
                        value_fmt: ascii
                        desc: "Device IMEI"
                    - field:
                        name: avl.data
                        type: bytes
                        len_expr: "remaining"
                        color: payload
                        desc: "AVL data array"

                    - hook:
                        name: enter_field_reader
                        args: { field: avl.data }
                        body:
                          - field:
                              name: codec.id
                              type: u8
                              color: codec
                              value_fmt: hex
                              desc: "Codec ID (0x08, 0x8E, 0x10)"
                          - field:
                              name: record_count.start
                              type: u8
                              color: meta
                              value_fmt: dec
                              desc: "Record count 1"
                          - switch:
                              expr: "codec.id"
                              cases:
                                0x08:
                                  - repeat:
                                      count_expr: "record_count.start"
                                      body:
                                        - field: { name: "avl.timestamp", type: u64, color: meta, value_fmt: unix_ms, desc: "Timestamp (UTC)" }
                                        - field: { name: "avl.priority", type: u8, color: meta, value_fmt: dec, desc: "Priority" }
                                        - field: { name: "gps.longitude", type: i32, color: meta, value_fmt: coord_1e7, desc: "Longitude (degrees)" }
                                        - field: { name: "gps.latitude", type: i32, color: meta, value_fmt: coord_1e7, desc: "Latitude (degrees)" }
                                        - field: { name: "gps.altitude_m", type: i16, color: meta, value_fmt: dec, desc: "Altitude (m)" }
                                        - field: { name: "gps.angle_deg", type: u16, color: meta, value_fmt: dec, desc: "Angle (degrees)" }
                                        - field: { name: "gps.satellites", type: u8, color: meta, value_fmt: dec, desc: "Satellite count" }
                                        - field: { name: "gps.speed_kmh", type: u16, color: meta, value_fmt: dec, desc: "Speed (km/h)" }
                                        - field: { name: "io.event_id", type: u8, color: io, value_fmt: dec, desc: "Event IO ID" }
                                        - field: { name: "io.total_count", type: u8, color: io, value_fmt: dec, desc: "Total IO elements" }
                                        - field: { name: "io.count_1b", type: u8, color: io, value_fmt: dec, desc: "1-byte IO element count" }
                                        - repeat:
                                            count_expr: "io.count_1b"
                                            body:
                                              - field: { name: "io.element_1b.id", type: u8, color: io, value_fmt: dec, desc: "1-byte IO ID" }
                                              - field: { name: "io.element_1b.value", type: u8, color: io, value_fmt: dec, desc: "1-byte IO value" }
                                        - field: { name: "io.count_2b", type: u8, color: io, value_fmt: dec, desc: "2-byte IO element count" }
                                        - repeat:
                                            count_expr: "io.count_2b"
                                            body:
                                              - field: { name: "io.element_2b.id", type: u8, color: io, value_fmt: dec, desc: "2-byte IO ID" }
                                              - field: { name: "io.element_2b.value", type: u16, color: io, value_fmt: dec, desc: "2-byte IO value" }
                                        - field: { name: "io.count_4b", type: u8, color: io, value_fmt: dec, desc: "4-byte IO element count" }
                                        - repeat:
                                            count_expr: "io.count_4b"
                                            body:
                                              - field: { name: "io.element_4b.id", type: u8, color: io, value_fmt: dec, desc: "4-byte IO ID" }
                                              - field: { name: "io.element_4b.value", type: u32, color: io, value_fmt: dec, desc: "4-byte IO value" }
                                        - field: { name: "io.count_8b", type: u8, color: io, value_fmt: dec, desc: "8-byte IO element count" }
                                        - repeat:
                                            count_expr: "io.count_8b"
                                            body:
                                              - field: { name: "io.element_8b.id", type: u8, color: io, value_fmt: dec, desc: "8-byte IO ID" }
                                              - field: { name: "io.element_8b.value", type: u64, color: io, value_fmt: dec, desc: "8-byte IO value" }

                                0x8E:
                                  - repeat:
                                      count_expr: "record_count.start"
                                      body:
                                        - field: { name: "avl.timestamp", type: u64, color: meta, value_fmt: unix_ms, desc: "Timestamp (UTC)" }
                                        - field: { name: "avl.priority", type: u8, color: meta, value_fmt: dec, desc: "Priority" }
                                        - field: { name: "gps.longitude", type: i32, color: meta, value_fmt: coord_1e7, desc: "Longitude (degrees)" }
                                        - field: { name: "gps.latitude", type: i32, color: meta, value_fmt: coord_1e7, desc: "Latitude (degrees)" }
                                        - field: { name: "gps.altitude_m", type: i16, color: meta, value_fmt: dec, desc: "Altitude (m)" }
                                        - field: { name: "gps.angle_deg", type: u16, color: meta, value_fmt: dec, desc: "Angle (degrees)" }
                                        - field: { name: "gps.satellites", type: u8, color: meta, value_fmt: dec, desc: "Satellite count" }
                                        - field: { name: "gps.speed_kmh", type: u16, color: meta, value_fmt: dec, desc: "Speed (km/h)" }
                                        - field: { name: "io.event_id", type: u16, color: io, value_fmt: dec, desc: "Event IO ID" }
                                        - field: { name: "io.total_count", type: u16, color: io, value_fmt: dec, desc: "Total IO elements" }
                                        - field: { name: "io.count_1b", type: u16, color: io, value_fmt: dec, desc: "1-byte IO element count" }
                                        - repeat:
                                            count_expr: "io.count_1b"
                                            body:
                                              - field: { name: "io.element_1b.id", type: u16, color: io, value_fmt: dec, desc: "1-byte IO ID" }
                                              - field: { name: "io.element_1b.value", type: u8, color: io, value_fmt: dec, desc: "1-byte IO value" }
                                        - field: { name: "io.count_2b", type: u16, color: io, value_fmt: dec, desc: "2-byte IO element count" }
                                        - repeat:
                                            count_expr: "io.count_2b"
                                            body:
                                              - field: { name: "io.element_2b.id", type: u16, color: io, value_fmt: dec, desc: "2-byte IO ID" }
                                              - field: { name: "io.element_2b.value", type: u16, color: io, value_fmt: dec, desc: "2-byte IO value" }
                                        - field: { name: "io.count_4b", type: u16, color: io, value_fmt: dec, desc: "4-byte IO element count" }
                                        - repeat:
                                            count_expr: "io.count_4b"
                                            body:
                                              - field: { name: "io.element_4b.id", type: u16, color: io, value_fmt: dec, desc: "4-byte IO ID" }
                                              - field: { name: "io.element_4b.value", type: u32, color: io, value_fmt: dec, desc: "4-byte IO value" }
                                        - field: { name: "io.count_8b", type: u16, color: io, value_fmt: dec, desc: "8-byte IO element count" }
                                        - repeat:
                                            count_expr: "io.count_8b"
                                            body:
                                              - field: { name: "io.element_8b.id", type: u16, color: io, value_fmt: dec, desc: "8-byte IO ID" }
                                              - field: { name: "io.element_8b.value", type: u64, color: io, value_fmt: dec, desc: "8-byte IO value" }
                                        - field: { name: "io.count_var", type: u16, color: io, value_fmt: dec, desc: "Variable-size IO element count" }
                                        - repeat:
                                            count_expr: "io.count_var"
                                            body:
                                              - field: { name: "io.element_var.id", type: u16, color: io, value_fmt: dec, desc: "Variable-size IO ID" }
                                              - field: { name: "io.element_var.length", type: u16, color: io, value_fmt: dec, desc: "Variable-size IO value length" }
                                              - field:
                                                  name: "io.element_var.value"
                                                  type: bytes
                                                  len_expr: "io.element_var.length"
                                                  color: io
                                                  value_fmt: hex
                                                  desc: "Variable-size IO value"

                                0x10:
                                  - repeat:
                                      count_expr: "record_count.start"
                                      body:
                                        - field: { name: "avl.timestamp", type: u64, color: meta, value_fmt: unix_ms, desc: "Timestamp (UTC)" }
                                        - field: { name: "avl.priority", type: u8, color: meta, value_fmt: dec, desc: "Priority" }
                                        - field: { name: "gps.longitude", type: i32, color: meta, value_fmt: coord_1e7, desc: "Longitude (degrees)" }
                                        - field: { name: "gps.latitude", type: i32, color: meta, value_fmt: coord_1e7, desc: "Latitude (degrees)" }
                                        - field: { name: "gps.altitude_m", type: i16, color: meta, value_fmt: dec, desc: "Altitude (m)" }
                                        - field: { name: "gps.angle_deg", type: u16, color: meta, value_fmt: dec, desc: "Angle (degrees)" }
                                        - field: { name: "gps.satellites", type: u8, color: meta, value_fmt: dec, desc: "Satellite count" }
                                        - field: { name: "gps.speed_kmh", type: u16, color: meta, value_fmt: dec, desc: "Speed (km/h)" }
                                        - field: { name: "avl.generation_type", type: u8, color: meta, value_fmt: dec, desc: "Generation type" }
                                        - field: { name: "io.event_id", type: u16, color: io, value_fmt: dec, desc: "Event IO ID" }
                                        - field: { name: "io.total_count", type: u16, color: io, value_fmt: dec, desc: "Total IO elements" }
                                        - field: { name: "io.count_1b", type: u8, color: io, value_fmt: dec, desc: "1-byte IO element count" }
                                        - repeat:
                                            count_expr: "io.count_1b"
                                            body:
                                              - field: { name: "io.element_1b.id", type: u16, color: io, value_fmt: dec, desc: "1-byte IO ID" }
                                              - field: { name: "io.element_1b.value", type: u8, color: io, value_fmt: dec, desc: "1-byte IO value" }
                                        - field: { name: "io.count_2b", type: u8, color: io, value_fmt: dec, desc: "2-byte IO element count" }
                                        - repeat:
                                            count_expr: "io.count_2b"
                                            body:
                                              - field: { name: "io.element_2b.id", type: u16, color: io, value_fmt: dec, desc: "2-byte IO ID" }
                                              - field: { name: "io.element_2b.value", type: u16, color: io, value_fmt: dec, desc: "2-byte IO value" }
                                        - field: { name: "io.count_4b", type: u8, color: io, value_fmt: dec, desc: "4-byte IO element count" }
                                        - repeat:
                                            count_expr: "io.count_4b"
                                            body:
                                              - field: { name: "io.element_4b.id", type: u16, color: io, value_fmt: dec, desc: "4-byte IO ID" }
                                              - field: { name: "io.element_4b.value", type: u32, color: io, value_fmt: dec, desc: "4-byte IO value" }
                                        - field: { name: "io.count_8b", type: u8, color: io, value_fmt: dec, desc: "8-byte IO element count" }
                                        - repeat:
                                            count_expr: "io.count_8b"
                                            body:
                                              - field: { name: "io.element_8b.id", type: u16, color: io, value_fmt: dec, desc: "8-byte IO ID" }
                                              - field: { name: "io.element_8b.value", type: u64, color: io, value_fmt: dec, desc: "8-byte IO value" }
                              default:
                                - field:
                                    name: "avl.data.unknown_codec_rest"
                                    type: bytes
                                    len_expr: "remaining"
                                    color: meta
                                    value_fmt: hex
                                    desc: "Unknown codec remainder"
                          - field:
                              name: record_count.end
                              type: u8
                              color: meta
                              value_fmt: dec
                              desc: "Record count 2"
                          - assert:
                              expr: "record_count.end == record_count.start"
                              message: "Record count mismatch"

            # UDP channel acknowledgement.
            udp_ack:
              - field:
                  name: udp.length
                  type: u16
                  color: len
                  value_fmt: dec
                  desc: "UDP packet length excluding this field"
              - assert:
                  expr: "udp.length == 5"
                  message: "UDP ack length must be 5"
              - field:
                  name: udp.packet_id
                  type: u16
                  color: header
                  value_fmt: dec
                  desc: "UDP packet ID"
              - field:
                  name: udp.channel_flag
                  type: u8
                  const: 0x01
                  color: meta
                  value_fmt: hex
                  desc: "Not usable byte (must be 0x01)"
              - field:
                  name: udp.avl_packet_id
                  type: u8
                  color: id
                  value_fmt: dec
                  desc: "AVL packet ID"
              - field:
                  name: avl.accepted_records
                  type: u8
                  color: id
                  value_fmt: dec
                  desc: "Accepted AVL record count"

          default:
            - assert:
                expr: "0 == 1"
                message: "Unknown Teltonika frame shape"

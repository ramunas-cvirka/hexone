# ------------------------------------------------------------
# Spec language summary (what this YAML uses)
#
# Node types:
#   - field: read a typed value, produce a span (and store value in ctx by name)
#   - assert: evaluate boolean expr, on false add error (and optionally stop)
#   - switch: evaluate expr, pick a case layout, else default
#   - repeat: repeat body count times
#   - hook: call custom Go hook; it may emit spans and/or set ctx values
#   - align: advance cursor to next boundary (pads/skips bytes)
#
# Expressions:
#   integers: 123, 0x1A
#   identifiers: previously parsed numeric fields, plus builtins:
#       remaining, offset, size
#   ops: + - * / % (int), parentheses
#   comparisons: == != < <= > >=
#   logical: && || !   (only used in assert)
# ------------------------------------------------------------

version: 1

protocols:
  - name: gt06
    desc: "GT06 / Jimi-style framing"
    endian: be
    colors:
      header: header
      len: len
      id: id
      payload: payload
      serial: serial
      meta: meta
      crc: crc
      tail: tail
      error: error

    layout:
      - field:
          {
            name: header,
            type: u16,
            color: header,
            desc: "Start bits (0x7878 or 0x7979)",
          }

      - switch:
          expr: "header"
          cases:
            0x7878:
              - field:
                  {
                    name: length,
                    type: u8,
                    color: len,
                    desc: "Packet length (protocol + info + serial + crc)",
                  }
            0x7979:
              - field:
                  {
                    name: length,
                    type: u16,
                    color: len,
                    desc: "Packet length (protocol + info + serial + crc)",
                  }
          default:
            - assert:
                {
                  expr: "0 == 1",
                  message: "Unknown GT06 header; expected 0x7878 or 0x7979",
                }

      - hook:
          name: gt06_normalize_length
          args:
            { length_field: length, payload_len_key: gt06.payload_len, mode_key: gt06.length_mode }

      - field: { name: protocol_id, type: u8, color: id, desc: "Protocol ID" }

      # Standard GT06 uses length = protocol(1) + info(N) + serial(2) + crc(2).
      # Some variants omit CRC from the advertised length; the hook above normalizes both.
      - field:
          name: payload
          type: bytes
          len_expr: "gt06.payload_len"
          color: payload
          desc: "Info content"

      - hook:
          name: enter_field_reader
          args: { field: payload }
          body:
            - switch:
                expr: "protocol_id"
                cases:
                  0x01:
                    - field:
                        {
                          name: "login.imei_bcd",
                          type: bytes,
                          len: 8,
                          color: meta,
                          value_fmt: bcd,
                          desc: "IMEI bytes (BCD-ish)",
                        }
                  0x13:
                    - field: { name: "hb.terminal_info", type: u8, color: meta, value_fmt: hex, desc: "Terminal information content" }
                    - field: { name: "hb.voltage", type: u8, color: meta, value_fmt: dec, desc: "Battery / voltage level" }
                    - field: { name: "hb.gsm", type: u8, color: meta, value_fmt: dec, desc: "GSM signal strength" }
                    - field: { name: "hb.alarm_lang", type: u16, color: meta, value_fmt: hex, desc: "Alarm / language" }
                  0x12:
                    - field: { name: "loc.datetime", type: bytes, len: 6, color: meta, value_fmt: datetime_bcd6, desc: "Tracker timestamp (YYMMDDhhmmss)" }
                    - field: { name: "loc.gps_info", type: u8, color: meta, value_fmt: hex, desc: "GPS info / satellite count" }
                    - field: { name: "loc.lat", type: u32, color: meta, value_fmt: coord_gt06, desc: "Latitude degrees (GT06 raw / 1800000)" }
                    - field: { name: "loc.lon", type: u32, color: meta, value_fmt: coord_gt06, desc: "Longitude degrees (GT06 raw / 1800000)" }
                    - field: { name: "loc.speed", type: u8, color: meta, value_fmt: dec, desc: "Speed km/h" }
                    - field: { name: "loc.course_status", type: u16, color: meta, value_fmt: hex, desc: "Course / status flags" }
                    - field: { name: "loc.mcc", type: u16, color: meta, value_fmt: dec, desc: "Mobile country code" }
                    - field: { name: "loc.mnc", type: u8, color: meta, value_fmt: dec, desc: "Mobile network code" }
                    - field: { name: "loc.lac", type: u16, color: meta, value_fmt: hex, desc: "Location area code" }
                    - field: { name: "loc.cell_id", type: u24, color: meta, value_fmt: hex, desc: "Cell ID" }
                  0x16:
                    - field: { name: "alarm.datetime", type: bytes, len: 6, color: meta, value_fmt: datetime_bcd6, desc: "Alarm timestamp (YYMMDDhhmmss)" }
                    - field: { name: "alarm.gps_info", type: u8, color: meta, value_fmt: hex, desc: "GPS info / satellite count" }
                    - field: { name: "alarm.lat", type: u32, color: meta, value_fmt: coord_gt06, desc: "Latitude degrees (GT06 raw / 1800000)" }
                    - field: { name: "alarm.lon", type: u32, color: meta, value_fmt: coord_gt06, desc: "Longitude degrees (GT06 raw / 1800000)" }
                    - field: { name: "alarm.speed", type: u8, color: meta, value_fmt: dec, desc: "Speed km/h" }
                    - field: { name: "alarm.course_status", type: u16, color: meta, value_fmt: hex, desc: "Course / status flags" }
                    - field: { name: "alarm.lbs_len", type: u8, color: meta, value_fmt: dec, desc: "LBS length" }
                    - field: { name: "alarm.mcc", type: u16, color: meta, value_fmt: dec, desc: "Mobile country code" }
                    - field: { name: "alarm.mnc", type: u8, color: meta, value_fmt: dec, desc: "Mobile network code" }
                    - field: { name: "alarm.lac", type: u16, color: meta, value_fmt: hex, desc: "Location area code" }
                    - field: { name: "alarm.cell_id", type: u24, color: meta, value_fmt: hex, desc: "Cell ID" }
                    - field: { name: "alarm.terminal_info", type: u8, color: meta, value_fmt: hex, desc: "Terminal information content" }
                    - field: { name: "alarm.voltage", type: u8, color: meta, value_fmt: dec, desc: "Battery / voltage level" }
                    - field: { name: "alarm.gsm", type: u8, color: meta, value_fmt: dec, desc: "GSM signal strength" }
                    - field: { name: "alarm.alarm_lang", type: u16, color: meta, value_fmt: hex, desc: "Alarm / language" }
                default:
                  - field:
                      {
                        name: "payload.rest",
                        type: bytes,
                        len_expr: "remaining",
                        color: meta,
                        desc: "Unparsed payload remainder",
                      }

      - field:
          {
            name: serial,
            type: u16,
            color: serial,
            value_fmt: dec,
            desc: "Information serial number",
          }

      - field:
          {
            name: crc,
            type: u16,
            color: crc,
            value_fmt: hex,
            desc: "CRC-ITU (aka X25/IBM-SDLC style in docs)",
          }

      - field:
          {
            name: stop,
            type: u16,
            const: 0x0D0A,
            color: tail,
            value_fmt: hex,
            desc: "Stop bits",
          }

      # Disabled for now: common public Jimi / GT06 examples frequently carry
      # CRC bytes that do not match the usual GT06 X25-style calculation.
      # Keep decoding the frame structure instead of rejecting an otherwise
      # well-formed packet.

  - name: teltonika_tcp
    desc: "Teltonika framed TCP body (AVL codecs 8/8E/16 and command codecs 12/13/14)"
    endian: be
    colors:
      header: header
      len: len
      codec: id
      payload: payload
      io: meta
      crc: crc
      error: error

    layout:
      - field:
          name: preamble
          type: u32
          const: 0x00000000
          color: header
          desc: "Preamble"

      # Data Field Length covers bytes [codec_id .. number_of_data_2].
      - field:
          name: data_length
          type: u32
          color: len
          value_fmt: dec
          desc: "Data Field Length"

      - assert:
          expr: "data_length + 4 <= remaining"
          message: "data_length exceeds remaining bytes"

      - field:
          name: data_field
          type: bytes
          len_expr: "data_length"
          color: payload
          desc: "AVL data array"

      # Stored as 4 bytes; the low 16 bits carry CRC-16/IBM.
      - field:
          name: crc
          type: u32
          color: crc
          value_fmt: hex
          desc: "CRC-16/IBM in low 16 bits"

      - hook:
          name: verify_teltonika_crc16_ibm
          args: { data_field: data_field, crc_field: crc }

      - hook:
          name: enter_field_reader
          args: { field: data_field }
          body:
            - field:
                name: codec_id
                type: u8
                color: codec
                value_fmt: hex
                desc: "Codec ID (0x08, 0x8E, 0x10, 0x0C, 0x0D, 0x0E)"

            - field:
                name: record_count_1
                type: u8
                color: meta
                value_fmt: dec
                desc: "Number of Data 1"

            - switch:
                expr: "codec_id"
                cases:
                  0x08:
                    - repeat:
                        count_expr: "record_count_1"
                        body:
                          - field: { name: "rec.ts", type: u64, color: meta, value_fmt: unix_ms, desc: "Timestamp (UTC)" }
                          - field: { name: "rec.prio", type: u8, color: meta, value_fmt: dec, desc: "Priority" }
                          - field: { name: "rec.lon", type: i32, color: meta, value_fmt: coord_1e7, desc: "Longitude degrees" }
                          - field: { name: "rec.lat", type: i32, color: meta, value_fmt: coord_1e7, desc: "Latitude degrees" }
                          - field: { name: "rec.alt", type: i16, color: meta, value_fmt: dec, desc: "Altitude m" }
                          - field: { name: "rec.angle", type: u16, color: meta, value_fmt: dec, desc: "Angle" }
                          - field: { name: "rec.sats", type: u8, color: meta, value_fmt: dec, desc: "Satellites" }
                          - field: { name: "rec.speed", type: u16, color: meta, value_fmt: dec, desc: "Speed km/h" }

                          - field: { name: "tel8.event_io_id", type: u8, color: io, desc: "Event IO ID" }
                          - field: { name: "tel8.io_total", type: u8, color: io, desc: "Total IO count" }

                          - field: { name: "tel8.n1", type: u8, color: io, desc: "N of 1-byte IO" }
                          - repeat:
                              count_expr: "tel8.n1"
                              body:
                                - field: { name: "tel8.io1.id", type: u8, color: io, desc: "1-byte IO ID" }
                                - field: { name: "tel8.io1.val", type: u8, color: io, desc: "1-byte IO value" }

                          - field: { name: "tel8.n2", type: u8, color: io, desc: "N of 2-byte IO" }
                          - repeat:
                              count_expr: "tel8.n2"
                              body:
                                - field: { name: "tel8.io2.id", type: u8, color: io, desc: "2-byte IO ID" }
                                - field: { name: "tel8.io2.val", type: u16, color: io, desc: "2-byte IO value" }

                          - field: { name: "tel8.n4", type: u8, color: io, desc: "N of 4-byte IO" }
                          - repeat:
                              count_expr: "tel8.n4"
                              body:
                                - field: { name: "tel8.io4.id", type: u8, color: io, desc: "4-byte IO ID" }
                                - field: { name: "tel8.io4.val", type: u32, color: io, desc: "4-byte IO value" }

                          - field: { name: "tel8.n8", type: u8, color: io, desc: "N of 8-byte IO" }
                          - repeat:
                              count_expr: "tel8.n8"
                              body:
                                - field: { name: "tel8.io8.id", type: u8, color: io, desc: "8-byte IO ID" }
                                - field: { name: "tel8.io8.val", type: u64, color: io, desc: "8-byte IO value" }
                    - field: { name: record_count_2, type: u8, color: meta, value_fmt: dec, desc: "Number of Data 2" }
                    - assert: { expr: "record_count_2 == record_count_1", message: "Record count mismatch" }

                  0x8E:
                    - repeat:
                        count_expr: "record_count_1"
                        body:
                          - field: { name: "rec8e.ts", type: u64, color: meta, value_fmt: unix_ms, desc: "Timestamp (UTC)" }
                          - field: { name: "rec8e.prio", type: u8, color: meta, value_fmt: dec, desc: "Priority" }
                          - field: { name: "rec8e.lon", type: i32, color: meta, value_fmt: coord_1e7, desc: "Longitude degrees" }
                          - field: { name: "rec8e.lat", type: i32, color: meta, value_fmt: coord_1e7, desc: "Latitude degrees" }
                          - field: { name: "rec8e.alt", type: i16, color: meta, value_fmt: dec, desc: "Altitude m" }
                          - field: { name: "rec8e.angle", type: u16, color: meta, value_fmt: dec, desc: "Angle" }
                          - field: { name: "rec8e.sats", type: u8, color: meta, value_fmt: dec, desc: "Satellites" }
                          - field: { name: "rec8e.speed", type: u16, color: meta, value_fmt: dec, desc: "Speed km/h" }

                          - field: { name: "tel8e.event_io_id", type: u16, color: io, desc: "Event IO ID" }
                          - field: { name: "tel8e.io_total", type: u16, color: io, desc: "Total IO count" }

                          - field: { name: "tel8e.n1", type: u16, color: io, desc: "N of 1-byte IO" }
                          - repeat:
                              count_expr: "tel8e.n1"
                              body:
                                - field: { name: "tel8e.io1.id", type: u16, color: io, desc: "1-byte IO ID" }
                                - field: { name: "tel8e.io1.val", type: u8, color: io, desc: "1-byte IO value" }

                          - field: { name: "tel8e.n2", type: u16, color: io, desc: "N of 2-byte IO" }
                          - repeat:
                              count_expr: "tel8e.n2"
                              body:
                                - field: { name: "tel8e.io2.id", type: u16, color: io, desc: "2-byte IO ID" }
                                - field: { name: "tel8e.io2.val", type: u16, color: io, desc: "2-byte IO value" }

                          - field: { name: "tel8e.n4", type: u16, color: io, desc: "N of 4-byte IO" }
                          - repeat:
                              count_expr: "tel8e.n4"
                              body:
                                - field: { name: "tel8e.io4.id", type: u16, color: io, desc: "4-byte IO ID" }
                                - field: { name: "tel8e.io4.val", type: u32, color: io, desc: "4-byte IO value" }

                          - field: { name: "tel8e.n8", type: u16, color: io, desc: "N of 8-byte IO" }
                          - repeat:
                              count_expr: "tel8e.n8"
                              body:
                                - field: { name: "tel8e.io8.id", type: u16, color: io, desc: "8-byte IO ID" }
                                - field: { name: "tel8e.io8.val", type: u64, color: io, desc: "8-byte IO value" }

                          - field: { name: "tel8e.nx", type: u16, color: io, desc: "N of variable-size IO" }
                          - repeat:
                              count_expr: "tel8e.nx"
                              body:
                                - field: { name: "tel8e.iox.id", type: u16, color: io, desc: "Variable IO ID" }
                                - field: { name: "tel8e.iox.len", type: u16, color: io, desc: "Variable IO length" }
                                - field:
                                    name: "tel8e.iox.val"
                                    type: bytes
                                    len_expr: "tel8e.iox.len"
                                    color: io
                                    value_fmt: hex
                                    desc: "Variable IO value"
                    - field: { name: record_count_2, type: u8, color: meta, value_fmt: dec, desc: "Number of Data 2" }
                    - assert: { expr: "record_count_2 == record_count_1", message: "Record count mismatch" }

                  0x10:
                    - repeat:
                        count_expr: "record_count_1"
                        body:
                          - field: { name: "rec16.ts", type: u64, color: meta, value_fmt: unix_ms, desc: "Timestamp (UTC)" }
                          - field: { name: "rec16.prio", type: u8, color: meta, value_fmt: dec, desc: "Priority" }
                          - field: { name: "rec16.lon", type: i32, color: meta, value_fmt: coord_1e7, desc: "Longitude degrees" }
                          - field: { name: "rec16.lat", type: i32, color: meta, value_fmt: coord_1e7, desc: "Latitude degrees" }
                          - field: { name: "rec16.alt", type: i16, color: meta, value_fmt: dec, desc: "Altitude m" }
                          - field: { name: "rec16.angle", type: u16, color: meta, value_fmt: dec, desc: "Angle" }
                          - field: { name: "rec16.sats", type: u8, color: meta, value_fmt: dec, desc: "Satellites" }
                          - field: { name: "rec16.speed", type: u16, color: meta, value_fmt: dec, desc: "Speed km/h" }
                          - field: { name: "rec16.generation_type", type: u8, color: meta, value_fmt: dec, desc: "Generation type" }

                          - field: { name: "tel16.event_io_id", type: u16, color: io, desc: "Event IO ID" }
                          - field: { name: "tel16.io_total", type: u16, color: io, desc: "Total IO count" }

                          - field: { name: "tel16.n1", type: u8, color: io, desc: "N of 1-byte IO" }
                          - repeat:
                              count_expr: "tel16.n1"
                              body:
                                - field: { name: "tel16.io1.id", type: u16, color: io, desc: "1-byte IO ID" }
                                - field: { name: "tel16.io1.val", type: u8, color: io, desc: "1-byte IO value" }

                          - field: { name: "tel16.n2", type: u8, color: io, desc: "N of 2-byte IO" }
                          - repeat:
                              count_expr: "tel16.n2"
                              body:
                                - field: { name: "tel16.io2.id", type: u16, color: io, desc: "2-byte IO ID" }
                                - field: { name: "tel16.io2.val", type: u16, color: io, desc: "2-byte IO value" }

                          - field: { name: "tel16.n4", type: u8, color: io, desc: "N of 4-byte IO" }
                          - repeat:
                              count_expr: "tel16.n4"
                              body:
                                - field: { name: "tel16.io4.id", type: u16, color: io, desc: "4-byte IO ID" }
                                - field: { name: "tel16.io4.val", type: u32, color: io, desc: "4-byte IO value" }

                          - field: { name: "tel16.n8", type: u8, color: io, desc: "N of 8-byte IO" }
                          - repeat:
                              count_expr: "tel16.n8"
                              body:
                                - field: { name: "tel16.io8.id", type: u16, color: io, desc: "8-byte IO ID" }
                                - field: { name: "tel16.io8.val", type: u64, color: io, desc: "8-byte IO value" }
                    - field: { name: record_count_2, type: u8, color: meta, value_fmt: dec, desc: "Number of Data 2" }
                    - assert: { expr: "record_count_2 == record_count_1", message: "Record count mismatch" }

                  0x0C:
                    - field: { name: message_type, type: u8, color: meta, value_fmt: hex, desc: "0x05 command / 0x06 response" }
                    - field: { name: message_size, type: u32, color: len, value_fmt: dec, desc: "Message size" }
                    - assert: { expr: "message_size <= remaining - 1", message: "Codec12 message exceeds remaining bytes" }
                    - field: { name: message, type: bytes, len_expr: "message_size", color: payload, value_fmt: ascii, desc: "Command or response text" }
                    - field: { name: quantity_2, type: u8, color: meta, value_fmt: dec, desc: "Quantity 2" }
                    - assert: { expr: "quantity_2 == record_count_1", message: "Codec12 quantity mismatch" }

                  0x0D:
                    - field: { name: message_type, type: u8, const: 0x06, color: meta, value_fmt: hex, desc: "Response type" }
                    - field: { name: message_size, type: u32, color: len, value_fmt: dec, desc: "Response size (includes timestamp)" }
                    - assert: { expr: "message_size >= 4 && message_size <= remaining - 1", message: "Codec13 response size invalid" }
                    - field: { name: timestamp, type: u32, color: meta, value_fmt: unix_s, desc: "Response timestamp (UTC)" }
                    - field: { name: message, type: bytes, len_expr: "message_size - 4", color: payload, value_fmt: ascii, desc: "Response text" }
                    - field: { name: quantity_2, type: u8, color: meta, value_fmt: dec, desc: "Quantity 2" }
                    - assert: { expr: "quantity_2 == record_count_1", message: "Codec13 quantity mismatch" }

                  0x0E:
                    - field: { name: message_type, type: u8, color: meta, value_fmt: hex, desc: "0x05 command / 0x06 response / 0x11 not executed" }
                    - field: { name: message_size, type: u32, color: len, value_fmt: dec, desc: "Message size (includes IMEI)" }
                    - assert: { expr: "message_size >= 8 && message_size <= remaining - 1", message: "Codec14 message size invalid" }
                    - field: { name: imei, type: bytes, len: 8, color: payload, value_fmt: bcd, desc: "Target device IMEI" }
                    - field: { name: message, type: bytes, len_expr: "message_size - 8", color: payload, value_fmt: ascii, desc: "Command or response text" }
                    - field: { name: quantity_2, type: u8, color: meta, value_fmt: dec, desc: "Quantity 2" }
                    - assert: { expr: "quantity_2 == record_count_1", message: "Codec14 quantity mismatch" }

                default:
                  - field:
                      name: "data_field.unknown_codec_rest"
                      type: bytes
                      len_expr: "remaining"
                      color: meta
                      value_fmt: hex
                      desc: "Unknown codec remainder"


  - name: teltonika_imei_tcp
    desc: "Teltonika TCP IMEI handshake packet"
    endian: be
    colors:
      header: header
      len: len
      payload: payload
      meta: meta
      error: error

    layout:
      - field:
          name: imei_len
          type: u16
          color: len
          value_fmt: dec
          desc: "IMEI length"

      - assert:
          expr: "imei_len <= remaining"
          message: "IMEI length exceeds remaining bytes"

      - field:
          name: imei
          type: bytes
          len_expr: "imei_len"
          color: payload
          value_fmt: ascii
          desc: "Module IMEI"

  - name: teltonika_imei_ack
    desc: "Teltonika TCP IMEI handshake response"
    endian: be
    colors:
      header: header
      id: id
      error: error

    layout:
      - field:
          name: accepted
          type: u8
          color: id
          value_fmt: dec
          desc: "0 rejected, 1 accepted"

  - name: teltonika_tcp_ack
    desc: "Teltonika TCP AVL data acknowledgement"
    endian: be
    colors:
      header: header
      len: len
      id: id
      meta: meta
      error: error

    layout:
      - field:
          name: accepted_records
          type: u32
          color: id
          value_fmt: dec
          desc: "Accepted data record count"

  - name: teltonika_udp
    desc: "Teltonika AVL over UDP channel (Codec 8, 8E, 16)"
    endian: be
    colors:
      header: header
      len: len
      codec: id
      payload: payload
      io: meta
      crc: crc
      error: error

    layout:
      - field:
          name: udp_length
          type: u16
          color: len
          value_fmt: dec
          desc: "Packet length (excluding this field)"

      - assert:
          expr: "udp_length >= 3 && udp_length <= remaining"
          message: "UDP length invalid or exceeds remaining bytes"

      - field:
          name: packet_id
          type: u16
          color: header
          value_fmt: dec
          desc: "UDP packet ID"

      - field:
          name: not_usable
          type: u8
          const: 0x01
          color: meta
          value_fmt: hex
          desc: "Not usable byte"

      - field:
          name: udp_payload
          type: bytes
          len_expr: "udp_length - 3"
          color: payload
          desc: "UDP channel payload"

      - hook:
          name: enter_field_reader
          args: { field: udp_payload }
          body:
            - field:
                name: avl_packet_id
                type: u8
                color: codec
                value_fmt: dec
                desc: "AVL packet ID"

            - field:
                name: imei_len
                type: u16
                color: len
                value_fmt: dec
                desc: "IMEI length"

            - assert:
                expr: "imei_len <= remaining"
                message: "UDP IMEI length exceeds remaining bytes"

            - field:
                name: imei
                type: bytes
                len_expr: "imei_len"
                color: payload
                value_fmt: ascii
                desc: "Module IMEI"

            - field:
                name: avl_array
                type: bytes
                len_expr: "remaining"
                color: payload
                desc: "AVL data array"

            - hook:
                name: enter_field_reader
                args: { field: avl_array }
                body:
                  - field:
                      name: codec_id
                      type: u8
                      color: codec
                      value_fmt: hex
                      desc: "Codec ID (0x08, 0x8E, 0x10)"

                  - field:
                      name: record_count_1
                      type: u8
                      color: meta
                      value_fmt: dec
                      desc: "Number of Data 1"

                  - switch:
                      expr: "codec_id"
                      cases:
                        0x08:
                          - repeat:
                              count_expr: "record_count_1"
                              body:
                                - field: { name: "rec.ts", type: u64, color: meta, value_fmt: unix_ms, desc: "Timestamp (UTC)" }
                                - field: { name: "rec.prio", type: u8, color: meta, value_fmt: dec, desc: "Priority" }
                                - field: { name: "rec.lon", type: i32, color: meta, value_fmt: coord_1e7, desc: "Longitude degrees" }
                                - field: { name: "rec.lat", type: i32, color: meta, value_fmt: coord_1e7, desc: "Latitude degrees" }
                                - field: { name: "rec.alt", type: i16, color: meta, value_fmt: dec, desc: "Altitude m" }
                                - field: { name: "rec.angle", type: u16, color: meta, value_fmt: dec, desc: "Angle" }
                                - field: { name: "rec.sats", type: u8, color: meta, value_fmt: dec, desc: "Satellites" }
                                - field: { name: "rec.speed", type: u16, color: meta, value_fmt: dec, desc: "Speed km/h" }

                                - field: { name: "tel8.event_io_id", type: u8, color: io, value_fmt: dec, desc: "Event IO ID" }
                                - field: { name: "tel8.io_total", type: u8, color: io, value_fmt: dec, desc: "Total IO count" }

                                - field: { name: "tel8.n1", type: u8, color: io, value_fmt: dec, desc: "N of 1-byte IO" }
                                - repeat:
                                    count_expr: "tel8.n1"
                                    body:
                                      - field: { name: "tel8.io1.id", type: u8, color: io, value_fmt: dec, desc: "1-byte IO ID" }
                                      - field: { name: "tel8.io1.val", type: u8, color: io, value_fmt: dec, desc: "1-byte IO value" }

                                - field: { name: "tel8.n2", type: u8, color: io, value_fmt: dec, desc: "N of 2-byte IO" }
                                - repeat:
                                    count_expr: "tel8.n2"
                                    body:
                                      - field: { name: "tel8.io2.id", type: u8, color: io, value_fmt: dec, desc: "2-byte IO ID" }
                                      - field: { name: "tel8.io2.val", type: u16, color: io, value_fmt: dec, desc: "2-byte IO value" }

                                - field: { name: "tel8.n4", type: u8, color: io, value_fmt: dec, desc: "N of 4-byte IO" }
                                - repeat:
                                    count_expr: "tel8.n4"
                                    body:
                                      - field: { name: "tel8.io4.id", type: u8, color: io, value_fmt: dec, desc: "4-byte IO ID" }
                                      - field: { name: "tel8.io4.val", type: u32, color: io, value_fmt: dec, desc: "4-byte IO value" }

                                - field: { name: "tel8.n8", type: u8, color: io, value_fmt: dec, desc: "N of 8-byte IO" }
                                - repeat:
                                    count_expr: "tel8.n8"
                                    body:
                                      - field: { name: "tel8.io8.id", type: u8, color: io, value_fmt: dec, desc: "8-byte IO ID" }
                                      - field: { name: "tel8.io8.val", type: u64, color: io, value_fmt: dec, desc: "8-byte IO value" }

                        0x8E:
                          - repeat:
                              count_expr: "record_count_1"
                              body:
                                - field: { name: "rec8e.ts", type: u64, color: meta, value_fmt: unix_ms, desc: "Timestamp (UTC)" }
                                - field: { name: "rec8e.prio", type: u8, color: meta, value_fmt: dec, desc: "Priority" }
                                - field: { name: "rec8e.lon", type: i32, color: meta, value_fmt: coord_1e7, desc: "Longitude degrees" }
                                - field: { name: "rec8e.lat", type: i32, color: meta, value_fmt: coord_1e7, desc: "Latitude degrees" }
                                - field: { name: "rec8e.alt", type: i16, color: meta, value_fmt: dec, desc: "Altitude m" }
                                - field: { name: "rec8e.angle", type: u16, color: meta, value_fmt: dec, desc: "Angle" }
                                - field: { name: "rec8e.sats", type: u8, color: meta, value_fmt: dec, desc: "Satellites" }
                                - field: { name: "rec8e.speed", type: u16, color: meta, value_fmt: dec, desc: "Speed km/h" }

                                - field: { name: "tel8e.event_io_id", type: u16, color: io, value_fmt: dec, desc: "Event IO ID" }
                                - field: { name: "tel8e.io_total", type: u16, color: io, value_fmt: dec, desc: "Total IO count" }

                                - field: { name: "tel8e.n1", type: u16, color: io, value_fmt: dec, desc: "N of 1-byte IO" }
                                - repeat:
                                    count_expr: "tel8e.n1"
                                    body:
                                      - field: { name: "tel8e.io1.id", type: u16, color: io, value_fmt: dec, desc: "1-byte IO ID" }
                                      - field: { name: "tel8e.io1.val", type: u8, color: io, value_fmt: dec, desc: "1-byte IO value" }

                                - field: { name: "tel8e.n2", type: u16, color: io, value_fmt: dec, desc: "N of 2-byte IO" }
                                - repeat:
                                    count_expr: "tel8e.n2"
                                    body:
                                      - field: { name: "tel8e.io2.id", type: u16, color: io, value_fmt: dec, desc: "2-byte IO ID" }
                                      - field: { name: "tel8e.io2.val", type: u16, color: io, value_fmt: dec, desc: "2-byte IO value" }

                                - field: { name: "tel8e.n4", type: u16, color: io, value_fmt: dec, desc: "N of 4-byte IO" }
                                - repeat:
                                    count_expr: "tel8e.n4"
                                    body:
                                      - field: { name: "tel8e.io4.id", type: u16, color: io, value_fmt: dec, desc: "4-byte IO ID" }
                                      - field: { name: "tel8e.io4.val", type: u32, color: io, value_fmt: dec, desc: "4-byte IO value" }

                                - field: { name: "tel8e.n8", type: u16, color: io, value_fmt: dec, desc: "N of 8-byte IO" }
                                - repeat:
                                    count_expr: "tel8e.n8"
                                    body:
                                      - field: { name: "tel8e.io8.id", type: u16, color: io, value_fmt: dec, desc: "8-byte IO ID" }
                                      - field: { name: "tel8e.io8.val", type: u64, color: io, value_fmt: dec, desc: "8-byte IO value" }

                                - field: { name: "tel8e.nx", type: u16, color: io, value_fmt: dec, desc: "N of variable-size IO" }
                                - repeat:
                                    count_expr: "tel8e.nx"
                                    body:
                                      - field: { name: "tel8e.iox.id", type: u16, color: io, value_fmt: dec, desc: "Variable IO ID" }
                                      - field: { name: "tel8e.iox.len", type: u16, color: io, value_fmt: dec, desc: "Variable IO length" }
                                      - field:
                                          name: "tel8e.iox.val"
                                          type: bytes
                                          len_expr: "tel8e.iox.len"
                                          color: io
                                          value_fmt: hex
                                          desc: "Variable IO value"

                        0x10:
                          - repeat:
                              count_expr: "record_count_1"
                              body:
                                - field: { name: "rec16.ts", type: u64, color: meta, value_fmt: unix_ms, desc: "Timestamp (UTC)" }
                                - field: { name: "rec16.prio", type: u8, color: meta, value_fmt: dec, desc: "Priority" }
                                - field: { name: "rec16.lon", type: i32, color: meta, value_fmt: coord_1e7, desc: "Longitude degrees" }
                                - field: { name: "rec16.lat", type: i32, color: meta, value_fmt: coord_1e7, desc: "Latitude degrees" }
                                - field: { name: "rec16.alt", type: i16, color: meta, value_fmt: dec, desc: "Altitude m" }
                                - field: { name: "rec16.angle", type: u16, color: meta, value_fmt: dec, desc: "Angle" }
                                - field: { name: "rec16.sats", type: u8, color: meta, value_fmt: dec, desc: "Satellites" }
                                - field: { name: "rec16.speed", type: u16, color: meta, value_fmt: dec, desc: "Speed km/h" }
                                - field: { name: "rec16.generation_type", type: u8, color: meta, value_fmt: dec, desc: "Generation type" }

                                - field: { name: "tel16.event_io_id", type: u16, color: io, value_fmt: dec, desc: "Event IO ID" }
                                - field: { name: "tel16.io_total", type: u16, color: io, value_fmt: dec, desc: "Total IO count" }

                                - field: { name: "tel16.n1", type: u8, color: io, value_fmt: dec, desc: "N of 1-byte IO" }
                                - repeat:
                                    count_expr: "tel16.n1"
                                    body:
                                      - field: { name: "tel16.io1.id", type: u16, color: io, value_fmt: dec, desc: "1-byte IO ID" }
                                      - field: { name: "tel16.io1.val", type: u8, color: io, value_fmt: dec, desc: "1-byte IO value" }

                                - field: { name: "tel16.n2", type: u8, color: io, value_fmt: dec, desc: "N of 2-byte IO" }
                                - repeat:
                                    count_expr: "tel16.n2"
                                    body:
                                      - field: { name: "tel16.io2.id", type: u16, color: io, value_fmt: dec, desc: "2-byte IO ID" }
                                      - field: { name: "tel16.io2.val", type: u16, color: io, value_fmt: dec, desc: "2-byte IO value" }

                                - field: { name: "tel16.n4", type: u8, color: io, value_fmt: dec, desc: "N of 4-byte IO" }
                                - repeat:
                                    count_expr: "tel16.n4"
                                    body:
                                      - field: { name: "tel16.io4.id", type: u16, color: io, value_fmt: dec, desc: "4-byte IO ID" }
                                      - field: { name: "tel16.io4.val", type: u32, color: io, value_fmt: dec, desc: "4-byte IO value" }

                                - field: { name: "tel16.n8", type: u8, color: io, value_fmt: dec, desc: "N of 8-byte IO" }
                                - repeat:
                                    count_expr: "tel16.n8"
                                    body:
                                      - field: { name: "tel16.io8.id", type: u16, color: io, value_fmt: dec, desc: "8-byte IO ID" }
                                      - field: { name: "tel16.io8.val", type: u64, color: io, value_fmt: dec, desc: "8-byte IO value" }

                      default:
                        - field:
                            name: "avl_array.unknown_codec_rest"
                            type: bytes
                            len_expr: "remaining"
                            color: meta
                            value_fmt: hex
                            desc: "Unknown codec remainder"

                  - field:
                      name: record_count_2
                      type: u8
                      color: meta
                      value_fmt: dec
                      desc: "Number of Data 2"

                  - assert:
                      expr: "record_count_2 == record_count_1"
                      message: "Record count mismatch"

  - name: teltonika_udp_ack
    desc: "Teltonika UDP channel acknowledgement"
    endian: be
    colors:
      header: header
      len: len
      id: id
      meta: meta
      error: error

    layout:
      - field:
          name: udp_length
          type: u16
          color: len
          value_fmt: dec
          desc: "Packet length (excluding this field)"

      - assert:
          expr: "udp_length == 5"
          message: "UDP ack length must be 5"

      - field:
          name: packet_id
          type: u16
          color: header
          value_fmt: dec
          desc: "UDP packet ID"

      - field:
          name: not_usable
          type: u8
          const: 0x01
          color: meta
          value_fmt: hex
          desc: "Not usable byte"

      - field:
          name: avl_packet_id
          type: u8
          color: id
          value_fmt: dec
          desc: "AVL packet ID"

      - field:
          name: accepted_records
          type: u8
          color: id
          value_fmt: dec
          desc: "Accepted data record count"

  - name: teltonika_codec12
    desc: "Teltonika Codec 12 (GPRS commands)"
    endian: be
    colors:
      header: header
      len: len
      id: id
      payload: payload
      meta: meta
      crc: crc
      error: error

    layout:
      - field:
          name: preamble
          type: u32
          const: 0x00000000
          color: header
          value_fmt: hex
          desc: "Preamble"

      - field:
          name: body_size
          type: u32
          color: len
          value_fmt: dec
          desc: "Body length"

      - assert:
          expr: "body_size + 4 <= remaining"
          message: "Codec12 body exceeds remaining bytes"

      - field:
          name: body
          type: bytes
          len_expr: "body_size"
          color: payload
          desc: "Codec12 body"

      - field:
          name: crc
          type: u32
          color: crc
          value_fmt: hex
          desc: "CRC-16/IBM in low 16 bits"

      - hook:
          name: verify_teltonika_crc16_ibm
          args: { data_field: body, crc_field: crc }

      - hook:
          name: enter_field_reader
          args: { field: body }
          body:
            - field: { name: codec_id, type: u8, const: 0x0C, color: id, value_fmt: hex, desc: "Codec ID" }
            - field: { name: quantity_1, type: u8, color: meta, value_fmt: dec, desc: "Quantity 1" }
            - field: { name: message_type, type: u8, color: meta, value_fmt: hex, desc: "0x05 command / 0x06 response" }
            - field: { name: message_size, type: u32, color: len, value_fmt: dec, desc: "Message size" }
            - assert: { expr: "message_size <= remaining - 1", message: "Codec12 message exceeds remaining bytes" }
            - field: { name: message, type: bytes, len_expr: "message_size", color: payload, value_fmt: ascii, desc: "Command or response text" }
            - field: { name: quantity_2, type: u8, color: meta, value_fmt: dec, desc: "Quantity 2" }
            - assert: { expr: "quantity_2 == quantity_1", message: "Codec12 quantity mismatch" }

  - name: teltonika_codec13
    desc: "Teltonika Codec 13 (device initiated response)"
    endian: be
    colors:
      header: header
      len: len
      id: id
      payload: payload
      meta: meta
      crc: crc
      error: error

    layout:
      - field:
          name: preamble
          type: u32
          const: 0x00000000
          color: header
          value_fmt: hex
          desc: "Preamble"

      - field:
          name: body_size
          type: u32
          color: len
          value_fmt: dec
          desc: "Body length"

      - assert:
          expr: "body_size + 4 <= remaining"
          message: "Codec13 body exceeds remaining bytes"

      - field:
          name: body
          type: bytes
          len_expr: "body_size"
          color: payload
          desc: "Codec13 body"

      - field:
          name: crc
          type: u32
          color: crc
          value_fmt: hex
          desc: "CRC-16/IBM in low 16 bits"

      - hook:
          name: verify_teltonika_crc16_ibm
          args: { data_field: body, crc_field: crc }

      - hook:
          name: enter_field_reader
          args: { field: body }
          body:
            - field: { name: codec_id, type: u8, const: 0x0D, color: id, value_fmt: hex, desc: "Codec ID" }
            - field: { name: quantity_1, type: u8, color: meta, value_fmt: dec, desc: "Quantity 1" }
            - field: { name: message_type, type: u8, const: 0x06, color: meta, value_fmt: hex, desc: "Response type" }
            - field: { name: message_size, type: u32, color: len, value_fmt: dec, desc: "Response size (includes timestamp)" }
            - assert: { expr: "message_size >= 4 && message_size <= remaining - 1", message: "Codec13 response size invalid" }
            - field: { name: timestamp, type: u32, color: meta, value_fmt: unix_s, desc: "Response timestamp (UTC)" }
            - field: { name: message, type: bytes, len_expr: "message_size - 4", color: payload, value_fmt: ascii, desc: "Response text" }
            - field: { name: quantity_2, type: u8, color: meta, value_fmt: dec, desc: "Quantity 2" }
            - assert: { expr: "quantity_2 == quantity_1", message: "Codec13 quantity mismatch" }

  - name: teltonika_codec14
    desc: "Teltonika Codec 14 (commands with IMEI)"
    endian: be
    colors:
      header: header
      len: len
      id: id
      payload: payload
      meta: meta
      crc: crc
      error: error

    layout:
      - field:
          name: preamble
          type: u32
          const: 0x00000000
          color: header
          value_fmt: hex
          desc: "Preamble"

      - field:
          name: body_size
          type: u32
          color: len
          value_fmt: dec
          desc: "Body length"

      - assert:
          expr: "body_size + 4 <= remaining"
          message: "Codec14 body exceeds remaining bytes"

      - field:
          name: body
          type: bytes
          len_expr: "body_size"
          color: payload
          desc: "Codec14 body"

      - field:
          name: crc
          type: u32
          color: crc
          value_fmt: hex
          desc: "CRC-16/IBM in low 16 bits"

      - hook:
          name: verify_teltonika_crc16_ibm
          args: { data_field: body, crc_field: crc }

      - hook:
          name: enter_field_reader
          args: { field: body }
          body:
            - field: { name: codec_id, type: u8, const: 0x0E, color: id, value_fmt: hex, desc: "Codec ID" }
            - field: { name: quantity_1, type: u8, color: meta, value_fmt: dec, desc: "Quantity 1" }
            - field: { name: message_type, type: u8, color: meta, value_fmt: hex, desc: "0x05 command / 0x06 response / 0x11 not executed" }
            - field: { name: message_size, type: u32, color: len, value_fmt: dec, desc: "Message size (includes IMEI)" }
            - assert: { expr: "message_size >= 8 && message_size <= remaining - 1", message: "Codec14 message size invalid" }
            - field: { name: imei, type: bytes, len: 8, color: payload, value_fmt: bcd, desc: "Target device IMEI" }
            - field: { name: message, type: bytes, len_expr: "message_size - 8", color: payload, value_fmt: ascii, desc: "Command or response text" }
            - field: { name: quantity_2, type: u8, color: meta, value_fmt: dec, desc: "Quantity 2" }
            - assert: { expr: "quantity_2 == quantity_1", message: "Codec14 quantity mismatch" }

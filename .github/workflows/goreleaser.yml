name: GoReleaser

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a real release instead of a snapshot. Run this from a v* tag.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install Linux GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            pkg-config \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libffi-dev \
            libxcursor-dev \
            libxfixes-dev \
            libvulkan-dev

      - name: Run Go unit tests
        run: go test ./...

  package-macos-dmg:
    runs-on: macos-14
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install macOS build dependencies
        run: brew install pkg-config

      - name: Build macOS app disk image
        run: make package-macos

      - name: Upload macOS disk image for GoReleaser
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-extra-macos-dmg
          path: dist/hexone_macos_arm64.dmg

  package-windows-msix:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install Windows cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            zip

      - name: Install nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build Windows Store MSIX package
        env:
          HEXONE_MSIX_PUBLISHER: ${{ vars.HEXONE_MSIX_PUBLISHER || 'CN=Ramunas Cvirka' }}
          HEXONE_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.HEXONE_MSIX_PUBLISHER_DISPLAY_NAME || 'Ramunas Cvirka' }}
        run: packaging/windows/build_msix.sh dist/hexone_windows_amd64.msix

      - name: Upload Windows MSIX for GoReleaser
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-extra-windows-msix
          path: dist/hexone_windows_amd64.msix

  goreleaser:
    runs-on: ubuntu-latest
    needs:
      - package-macos-dmg
      - package-windows-msix

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install Linux build and Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-mingw-w64-x86-64 \
            gcc \
            gcc-mingw-w64-x86-64 \
            patchelf \
            pkg-config \
            flatpak \
            flatpak-builder \
            libxcb-xkb1 \
            libxcb-xkb-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-x11-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libffi-dev \
            libxcursor-dev \
            libxfixes-dev \
            libvulkan-dev
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.freedesktop.Platform/x86_64/24.08 \
            org.freedesktop.Sdk/x86_64/24.08

      - name: Download extra release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: goreleaser-extra-*
          path: dist/external
          merge-multiple: true

      - name: Run GoReleaser snapshot
        if: ${{ !inputs.publish }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_SKIP_HOMEBREW: "true"

      - name: Run GoReleaser release
        if: ${{ inputs.publish }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GORELEASER_SKIP_HOMEBREW: ${{ secrets.HOMEBREW_TAP_TOKEN == '' && 'true' || 'false' }}

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Linux GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            pkg-config \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libffi-dev \
            libxcursor-dev \
            libxfixes-dev \
            libvulkan-dev

      - name: Run Go unit tests
        run: go test ./...

  build-linux-windows:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            pkg-config \
            zip \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libffi-dev \
            libxcursor-dev \
            libxfixes-dev \
            libvulkan-dev

      - name: Build Linux release archive
        run: make package-linux

      - name: Build Windows portable release archive
        run: make package-windows

      - name: Upload Linux release archive
        uses: actions/upload-artifact@v4
        with:
          name: hexone-linux-amd64-zip
          path: dist/hexone_linux_amd64.zip

      - name: Upload Windows portable release archive
        uses: actions/upload-artifact@v4
        with:
          name: hexone-windows-amd64-portable-zip
          path: dist/hexone_windows_amd64_portable.zip

  build-macos:
    runs-on: macos-14
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build macOS app disk image
        run: make package-macos

      - name: Upload macOS app disk image
        uses: actions/upload-artifact@v4
        with:
          name: hexone-macos-arm64-dmg
          path: dist/hexone_macos_arm64.dmg

  release:
    runs-on: ubuntu-latest
    needs:
      - build-linux-windows
      - build-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download packaged release archives
        uses: actions/download-artifact@v4
        with:
          path: dist/assets

      - name: Extract changelog section for this tag
        run: |
          TAG="${{ github.ref_name }}"
          awk -v tag="## ${TAG}" '
            index($0, tag) == 1 {found=1}
            found {
              if ($0 ~ /^## / && index($0, tag) != 1) exit
              print
            }
          ' CHANGELOG.md > RELEASE_BODY.md

          if [ ! -s RELEASE_BODY.md ]; then
            printf "## %s\n\n- No changelog notes found for this tag.\n" "$TAG" > RELEASE_BODY.md
          fi

          echo "=== Extracted changelog ==="
          cat RELEASE_BODY.md

      - name: Create GitHub Release and upload release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            dist/assets/hexone-linux-amd64-zip/hexone_linux_amd64.zip
            dist/assets/hexone-macos-arm64-dmg/hexone_macos_arm64.dmg
            dist/assets/hexone-windows-amd64-portable-zip/hexone_windows_amd64_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install Linux GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            pkg-config \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libffi-dev \
            libxcursor-dev \
            libxfixes-dev \
            libvulkan-dev

      - name: Run Go unit tests
        run: go test ./...

  build-linux-windows:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            gcc \
            patchelf \
            pkg-config \
            zip \
            libxcb-xkb1 \
            libxcb-xkb-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-x11-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libffi-dev \
            libxcursor-dev \
            libxfixes-dev \
            libvulkan-dev

      - name: Install AppImage tooling
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$HOME/.local/bin/appimagetool.AppImage"
          chmod +x "$HOME/.local/bin/appimagetool.AppImage"
          cat > "$HOME/.local/bin/appimagetool" <<'EOF'
          #!/bin/sh
          exec "$(dirname "$0")/appimagetool.AppImage" --appimage-extract-and-run "$@"
          EOF
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Linux AppImage
        run: make package-linux

      - name: Build Windows portable release archive
        run: make package-windows

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: hexone-linux-amd64-appimage
          path: dist/hexone_linux_amd64.AppImage

      - name: Upload Windows portable release archive
        uses: actions/upload-artifact@v4
        with:
          name: hexone-windows-amd64-portable-zip
          path: dist/hexone_windows_amd64_portable.zip

  build-macos:
    runs-on: macos-14
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install macOS PDFium build dependencies
        run: brew install pkg-config

      - name: Build macOS app disk image
        run: make package-macos

      - name: Upload macOS app disk image
        uses: actions/upload-artifact@v4
        with:
          name: hexone-macos-arm64-dmg
          path: dist/hexone_macos_arm64.dmg

  build-windows-store:
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          choco install make mingw --no-progress -y
          $windres = @(
            'C:\ProgramData\chocolatey\lib\mingw',
            'C:\ProgramData\mingw64'
          ) | Where-Object { Test-Path $_ } |
            ForEach-Object { Get-ChildItem $_ -Filter windres.exe -Recurse -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $windres) {
            throw "windres.exe was not installed"
          }
          $windres.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Microsoft Store MSIX
        env:
          HEXONE_MSIX_IDENTITY_NAME: ${{ vars.HEXONE_MSIX_IDENTITY_NAME || 'RamnasCvirka.hexone' }}
          HEXONE_MSIX_PUBLISHER: ${{ vars.HEXONE_MSIX_PUBLISHER || 'CN=F267E84A-8585-42BC-92A8-D98FDFEA2938' }}
        run: make package-windows-msix MSIX_DEV_SIGN=false

      - name: Upload Microsoft Store MSIX
        uses: actions/upload-artifact@v4
        with:
          name: hexone-windows-amd64-msix
          path: dist/hexone_windows_amd64.msix

  release:
    runs-on: ubuntu-latest
    needs:
      - build-linux-windows
      - build-macos
      - build-windows-store

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download packaged release archives
        uses: actions/download-artifact@v4
        with:
          path: dist/assets

      - name: Extract changelog section for this tag
        run: |
          TAG="${{ github.ref_name }}"
          awk -v tag="## ${TAG}" '
            index($0, tag) == 1 {found=1}
            found {
              if ($0 ~ /^## / && index($0, tag) != 1) exit
              print
            }
          ' CHANGELOG.md > RELEASE_BODY.md

          if [ ! -s RELEASE_BODY.md ]; then
            printf "## %s\n\n- No changelog notes found for this tag.\n" "$TAG" > RELEASE_BODY.md
          fi

          echo "=== Extracted changelog ==="
          cat RELEASE_BODY.md

      - name: Create GitHub Release and upload release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            dist/assets/hexone-linux-amd64-appimage/hexone_linux_amd64.AppImage
            dist/assets/hexone-macos-arm64-dmg/hexone_macos_arm64.dmg
            dist/assets/hexone-windows-amd64-msix/hexone_windows_amd64.msix
            dist/assets/hexone-windows-amd64-portable-zip/hexone_windows_amd64_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-microsoft-store:
    runs-on: windows-latest
    needs:
      - build-windows-store
      - release

    steps:
      - name: Check Microsoft Store publishing configuration
        id: store-config
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $values = @(
            $env:AZURE_AD_APPLICATION_CLIENT_ID,
            $env:AZURE_AD_APPLICATION_SECRET,
            $env:AZURE_AD_TENANT_ID,
            $env:SELLER_ID
          )
          $configured = @($values | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($configured -eq 0) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Microsoft Store publishing is not configured; the MSIX remains available on the GitHub release."
            exit 0
          }
          if ($configured -ne $values.Count) {
            throw "Microsoft Store publishing is only partially configured. Add all four Partner Center secrets or remove them all."
          }
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download Microsoft Store MSIX
        if: steps.store-config.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: hexone-windows-amd64-msix
          path: dist/store

      - name: Configure Microsoft Store CLI
        if: steps.store-config.outputs.enabled == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.2

      - name: Authenticate with Partner Center
        if: steps.store-config.outputs.enabled == 'true'
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          msstore reconfigure `
            --tenantId "$env:AZURE_AD_TENANT_ID" `
            --sellerId "$env:SELLER_ID" `
            --clientId "$env:AZURE_AD_APPLICATION_CLIENT_ID" `
            --clientSecret "$env:AZURE_AD_APPLICATION_SECRET"

      - name: Submit update to Microsoft Store
        if: steps.store-config.outputs.enabled == 'true'
        shell: pwsh
        env:
          HEXONE_MS_STORE_PRODUCT_ID: ${{ vars.HEXONE_MS_STORE_PRODUCT_ID || '9NRFGTN6VGQK' }}
        run: |
          msstore publish "$env:GITHUB_WORKSPACE\dist\store\hexone_windows_amd64.msix" `
            -id "$env:HEXONE_MS_STORE_PRODUCT_ID"

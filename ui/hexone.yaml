date_formats:
    - Jan 02 2006 15:04
    - Jan 02 15:04
    - Jan 02 2006
    - Jan 02
    - 01-02
favorite_locations: []
name_compact:
    keep_start_chars: 6
    marker: ..
columns:
    full_chars: 20
    brief_chars: 16
    full_drop_priority:
        - date
        - size
        - permissions
        - name
    show_permissions: true
    permission_format: auto
sort:
    default_key: name
    descending: false
    directories_first: true
general:
    typeface: Fira Code
    font_size_sp: 14
    dim_inactive_panes: false
colors:
    file_pane_background: '#202020'
    file_pane_text: '#D2D2D2'
    hover: '#2D2D2D'
    hover_text: '#E8E8E8'
    selection: '#3C3C50'
    selection_text: '#F4F4F4'
    selected_files: '#4A4A4A'
    selected_files_text: '#F4F4F4'
    focused_selected: '#58586C'
    focused_selected_text: '#F4F4F4'
    current_dir_background: '#363636'
    current_dir_text: '#F0F0F0'
viewer:
    mode: file
    file_encoding: auto
    typeface: Fira Code
    background: '#202020'
    text: '#D2D2D2'
    selection: '#3C3C50'
    shell: auto
    command: cat {path}
    remote_search_mode: remote
    remote_search_command: tail -c +{range_start_1based} {path} | head -c {range_len} | LC_ALL=C grep -aobF {match_limit} -- {pattern} | {result_select}
    command_by_target: {}
    command_history: []
    word_select_regex: '[a-zA-Z0-9]+'
    font_size_sp: 13
    word_wrap: false
    max_read_mb: 1
    command_auto_refresh: true
    command_refresh_ms: 1500
    hide_function_bar_when_open: true
ssh:
    setups: []
